name: Deploy API to cPanel

# Uploads the Laravel code only. vendor/ is installed on the server by
# backend/deploy/cron-composer.php (cron), because the host drops the FTP
# connection when ~7000 vendor files are uploaded.
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./backend/
          server-dir: ./
          timeout: 120000
          exclude: |
            .env
            node_modules/**
            tests/**
            vendor/**
            storage/logs/**
